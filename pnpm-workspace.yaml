# Dépendances autorisées à exécuter un script d'installation (binaires natifs).
allowBuilds:
  '@node-rs/argon2': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - lucide-react@1.52.0

# Correctifs de sécurité de dépendances indirectes (GHSA-67mh-4wv8-2f99 : esbuild ≤ 0.24.2,
# embarqué par l'ancien chargeur de drizzle-kit).
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
