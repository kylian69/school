  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/platform-fastify': 12.1.2
  '@nestjs/testing': 12.1.2
  '@node-rs/argon2': 2.2.1
  '@swc/core': 1.16.13
  '@types/node': 24.19.1
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/coverage-v8': 5.0.3
  better-auth: 1.7.7
  bullmq: 6.3.11
  dependency-cruiser: 18.5.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  eslint-config-next: 16.3.8
  eslint: 9.39.5
  fastify: 5.12.5
  globals: 17.13.0
  ioredis: 6.0.0
  next: 16.3.8
  nodemailer: 10.0.14
  pg: 8.23.1
  pino: 10.4.0
  prettier: 3.9.9
  react-dom: 19.3.0
  react: 19.3.0
  reflect-metadata: 0.2.2
