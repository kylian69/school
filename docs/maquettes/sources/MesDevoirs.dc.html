<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes devoirs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.light{--bg:#F6F7F9;--surface:#FFFFFF;--surface2:#F0F1F5;--line:#E3E5EC;--fg:#0E1022;--muted:#545870;--subtle:#686C82;--accent:#4F46E5;--accent-soft:#ECEEFF;--accent-fg:#FFFFFF;--ok:#0B7A4B;--ok-soft:#E2F5EB;--warn:#9A5800;--warn-soft:#FFF1D9;--bad:#BF2338;--bad-soft:#FDE7EA;--grid:rgba(14,16,34,.045)}
.dark{--bg:#0B0C10;--surface:#13151C;--surface2:#1B1E28;--line:#272B38;--fg:#F2F3F8;--muted:#A6AABF;--subtle:#8E93AA;--accent:#8E8CFF;--accent-soft:#1F2052;--accent-fg:#0B0C10;--ok:#4ADE95;--ok-soft:#0F2A1F;--warn:#F5B454;--warn-soft:#2E2312;--bad:#FF7D8C;--bad-soft:#331820;--grid:rgba(255,255,255,.035)}
.sc{font-family:'Geist',ui-sans-serif,system-ui,sans-serif;color:var(--fg);background-color:var(--bg);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.sc a{text-decoration:none}
.sc button{font-family:inherit;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.tab:hover{color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div class="sc {{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column">
<div style="flex-grow: 1; overflow: hidden; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: var(--muted)">Inès · BTS MCO 2</span>
<span style="font-size: 26px; font-weight: 650; letter-spacing: -0.035em">Mes devoirs</span>
</div>

<div style="padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; font-weight: 600">Charge de la semaine</span><span class="num" style="font-size: 13px; color: var(--muted)">{{load}}</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; align-items: end; height: 54px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div title="{{d.title}}" style="width: 100%; border-radius: 6px; background: {{d.color}}; {{d.h}}"></div>
<span style="font-size: 11px; color: var(--muted)">{{d.label}}</span>
</div>
</sc-for>
</div>
</div>

<sc-for list="{{items}}" as="t" hint-placeholder-count="4">
<div style="padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start">
<button type="button" role="checkbox" aria-label="{{t.aria}}" onClick="{{t.toggle}}" style="flex-shrink: 0; width: 24px; height: 24px; margin-top: 2px; border-radius: 8px; padding: 0; display: flex; align-items: center; justify-content: center; {{t.box}}">
<sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</button>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; {{t.fade}}">
<span style="font-size: 14px; font-weight: 550">{{t.title}}</span>
<span style="font-size: 12.5px; color: var(--muted)">{{t.module}}</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px">
<span class="num" style="padding: 2px 8px; border-radius: 999px; background: {{t.dueBg}}; color: {{t.dueFg}}; font-weight: 600">{{t.due}}</span>
<sc-if value="{{t.upload}}" hint-placeholder-val="{{ false }}"><span style="padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted)">{{t.uploadLabel}}</span></sc-if>
</div>
</div>
<sc-if value="{{t.canUpload}}" hint-placeholder-val="{{ false }}">
<button class="btn" type="button" onClick="{{t.send}}" style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-fg); font-size: 12.5px; font-weight: 600">Rendre</button>
</sc-if>
</div>
</sc-for>
</div>

<nav aria-label="Navigation principale" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 8px 18px; border-top: 1px solid var(--line); background: var(--surface)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a class="tab" href="{{t.href}}" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: {{t.color}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg>
{{t.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { 4: true }, sent: {} };
  }
  renderVals() {
    const st = this.state;
    const src = [
      { id: 1, title: 'Cas pratique n° 3 · analyse en 1 page', module: 'Droit des affaires · Sophie Arnaud', due: 'Lun. 5/10', dueTone: 'warn', online: true, mins: 45 },
      { id: 2, title: 'Lire le chapitre 4 et préparer 3 questions', module: 'Gestion commerciale · Paul Dumas', due: 'Mar. 6/10', online: false, mins: 30 },
      { id: 3, title: 'Plan d’implantation du rayon running', module: 'Marketing opérationnel · Karim Benoît', due: 'Mer. 7/10', online: true, mins: 90 },
      { id: 4, title: 'Vocabulaire unité 3', module: 'Anglais professionnel · Julien Moreau', due: 'Fait le 1/10', online: false, mins: 20 }
    ];
    const items = src.map((t) => {
      const done = !!st.done[t.id] || !!st.sent[t.id];
      return {
        title: t.title, module: t.module, done,
        aria: 'Marquer comme fait : ' + t.title,
        due: st.sent[t.id] ? 'Rendu à l’instant' : t.due,
        dueBg: done ? 'var(--ok-soft)' : t.dueTone === 'warn' ? 'var(--warn-soft)' : 'var(--accent-soft)',
        dueFg: done ? 'var(--ok)' : t.dueTone === 'warn' ? 'var(--warn)' : 'var(--accent)',
        upload: t.online, uploadLabel: st.sent[t.id] ? 'Accusé de réception reçu' : 'À rendre en ligne · ~' + t.mins + ' min',
        canUpload: t.online && !done,
        box: done ? 'border: 0; background: var(--accent); color: var(--accent-fg)' : 'border: 1.5px solid var(--line); background: var(--surface); color: transparent',
        fade: done ? 'opacity: 0.55' : '',
        toggle: () => this.setState({ done: { ...this.state.done, [t.id]: !this.state.done[t.id] } }),
        send: () => this.setState({ sent: { ...this.state.sent, [t.id]: true } })
      };
    });
    const mins = [45, 30, 90, 0, 0];
    const left = src.filter((t) => !st.done[t.id] && !st.sent[t.id]).reduce((a, t) => a + t.mins, 0);
    const days = ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.'].map((l, i) => ({
      label: l, title: l + ' : ' + mins[i] + ' min',
      h: 'height: ' + Math.max(4, Math.round(mins[i] / 90 * 36)) + 'px',
      color: mins[i] >= 90 ? 'var(--warn)' : mins[i] ? 'var(--accent)' : 'var(--surface2)'
    }));
    const tabs = [
      { label: 'Accueil', d: 'M4 11l8-7 8 7v9h-5v-6H9v6H4z', href: 'AccueilApprenant.dc.html' },
      { label: 'Planning', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', href: '#' },
      { label: 'Devoirs', d: 'M9 5h10M9 12h10M9 19h10M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2', href: '#', on: true },
      { label: 'Notes', d: 'M5 4h14v16H5zM9 8h6M9 12h6M9 16h3', href: '#' },
      { label: 'Profil', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 21a8 8 0 0 1 16 0', href: '#' }
    ].map((t) => ({ ...t, color: t.on ? 'var(--accent)' : 'var(--subtle)' }));
    return { theme: this.props.theme ?? 'light', items, days, tabs, load: Math.floor(left / 60) + ' h ' + String(left % 60).padStart(2, '0') + ' restantes' };
  }
}
</script>
</body>
</html>
