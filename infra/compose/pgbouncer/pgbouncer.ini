; PgBouncer en mode transaction (architecture section 3) : l'organisation de chaque requête est
; fixée par transaction (set_config local), ce qui est compatible avec ce mode.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
ignore_startup_parameters = extra_float_digits,options
