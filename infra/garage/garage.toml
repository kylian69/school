# Garage : stockage compatible S3 de l'auto-hébergement (ADR 0003). Un seul nœud.
# Les secrets (rpc_secret, admin_token) sont fournis par l'environnement :
# GARAGE_RPC_SECRET (64 caractères hexadécimaux) et GARAGE_ADMIN_TOKEN.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
