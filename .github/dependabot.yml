# Mises à jour proposées automatiquement (SEC-07 : correctif de sécurité sous 7 jours).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependances-mineures:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directories: [/infra/docker]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
